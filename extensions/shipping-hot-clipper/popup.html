<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Shipping HOT 剪藏</title></head><body>
<h1>Shipping HOT 人工剪藏</h1><p>提取后可编辑标题和正文，确认后送到系统保存。</p>
<label>提取范围<select id="mode"><option value="article">当前文章</option><option value="selection">选中文字</option><option value="metadata">仅标题链接</option></select></label><button id="extract" type="button">重新提取</button>
<label>实际页面地址<input id="url" readonly></label><label>标题<input id="title" maxlength="500"></label><label>正文或摘录<textarea id="body" maxlength="100000"></textarea></label>
<p id="date"></p><p>作为人工私人资料保存，权利状态未知。</p>
<button id="send" type="button">送到 Shipping HOT 预览</button><p id="status" role="status"></p>
<script type="module" src="/src/popup.ts"></script></body></html>
