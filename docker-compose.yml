services:
  shipping-hot:
    build:
      context: .
      dockerfile: Dockerfile
    image: shipping-hot:local
    ports:
      - '127.0.0.1:4444:4444'
    volumes:
      - shipping_hot_data:/usr/app/.data
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - NODE_ENV=production
      # Safe default. Real Mode never inherits host .env.local automatically;
      # inject it explicitly through an untracked override at runtime.
      - SHIPPING_DATA_MODE=mock
      - SHIPPING_RUNTIME_ENABLED=true

volumes:
  shipping_hot_data:
    # Preserve the existing physical volume. Renaming it is a separate data migration.
    name: newsnow_data
