# Kept as a compatible local entrypoint. Both compose files build this repository.
services:
  shipping-hot:
    build:
      context: .
      dockerfile: Dockerfile
    image: shipping-hot:local
    ports:
      - '127.0.0.1:4444:4444'
    volumes:
      - shipping_hot_data:/usr/app/.data
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - NODE_ENV=production
      - SHIPPING_DATA_MODE=mock
      - SHIPPING_RUNTIME_ENABLED=true

volumes:
  shipping_hot_data:
    # Compatibility only: never drop the existing volume during product cleanup.
    name: newsnow_data
