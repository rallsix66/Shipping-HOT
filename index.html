<!doctype html>
<html lang="zh-CN" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/shipping-hot-icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEO Meta Tags (local single-user tool: not indexed) -->
  <meta name="description" content="Shipping HOT - 本地航运态势与热点信号工作台，聚合船舶动态、港口情报、天气预警与航运资讯" />
  <meta name="keywords" content="航运,船舶,港口,天气预警,航运资讯,Shipping HOT" />
  <meta name="author" content="Shipping HOT" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Shipping HOT" />
  <meta property="og:description" content="本地航运态势与热点信号工作台" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Shipping HOT" />
  <meta name="twitter:description" content="本地航运态势与热点信号工作台" />

  <meta name="theme-color" content="#0F2A43" />
  <link rel="preload" href="/Baloo2-Bold.subset.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="apple-touch-icon" href="/shipping-hot-icon.svg" sizes="192x192" />

  <script>
    // 首帧前按本地偏好同步主题，避免暗/亮闪烁（useDark 存 localStorage["color-scheme"]）
    try {
      var __scheme = JSON.parse(localStorage.getItem("color-scheme") || '"dark"')
      var __dark = __scheme === "auto" ? window.matchMedia("(prefers-color-scheme: dark)").matches : __scheme !== "light"
      document.documentElement.classList.toggle("dark", __dark)
    }
    catch (e) {
      document.documentElement.classList.add("dark")
    }
  </script>
  <title>Shipping HOT</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
